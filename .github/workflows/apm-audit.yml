# Reusable workflow: APM audit for any consumer repo in the org.
#
# Usage in a consumer repo:
#
#   jobs:
#     apm-audit:
#       uses: DigitalInnovation/.github/.github/workflows/apm-audit.yml@main
#       with:
#         enforcement: warn   # or "block" once your repo is ready
#
# During the org-wide WARN phase this workflow MUST NOT be a required check.
# Once `apm-policy.yml` flips to `enforcement: block`, principal-engineers
# will set this as a required status check across the org.

name: APM Audit (reusable)

on:
  workflow_call:
    inputs:
      enforcement:
        description: "Override audit enforcement: warn | block"
        type: string
        default: warn
      apm-version:
        description: "APM CLI version to install (or 'latest')"
        type: string
        default: latest

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install APM CLI
        env:
          APM_VERSION: ${{ inputs.apm-version }}
        run: |
          curl -sSL https://aka.ms/apm-unix | sh
          echo "$HOME/.apm/bin" >> "$GITHUB_PATH"

      - name: apm install (resolve + lockfile)
        run: apm install --frozen-lockfile

      - name: apm audit --ci
        env:
          APM_ENFORCEMENT: ${{ inputs.enforcement }}
        run: |
          # During the WARN phase we never fail the build; findings are
          # printed to the job log and uploaded as a build artifact below.
          # (Code Scanning / SARIF upload requires GitHub Advanced Security,
          # which is not enabled on this org — keep audit output local.)
          mkdir -p apm-audit-out
          if [ "$APM_ENFORCEMENT" = "block" ]; then
            apm audit --ci | tee apm-audit-out/apm-audit.log
          else
            apm audit --ci | tee apm-audit-out/apm-audit.log || true
          fi

      - name: Upload audit log artifact
        if: always() && hashFiles('apm-audit-out/apm-audit.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apm-audit-log
          path: apm-audit-out/apm-audit.log
          retention-days: 30
